<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poeticle Player</title>
    <style>
        /* --- 共通設定 --- */
        :root {
            --bg-color: #000;
            --text-color: #e0e0e0;
            --accent-color: #444;
            --font-main: "Yu Mincho", "Hiragino Mincho ProN", serif;
        }

        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            font-family: var(--font-main);
        }

        /* --- UI: 設定画面（スタート画面） --- */
        #config-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.8s;
        }
        
        .input-group {
            width: 90%;
            max-width: 600px;
            text-align: center;
        }

        h1 { letter-spacing: 0.2em; font-weight: normal; margin-bottom: 30px; }

        textarea {
            width: 100%;
            height: 150px;
            background: #111;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            font-family: var(--font-main);
            font-size: 1rem;
            margin-bottom: 20px;
            resize: none;
            outline: none;
            border-radius: 4px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        label { cursor: pointer; padding: 10px 20px; border: 1px solid #333; border-radius: 20px; transition: 0.3s; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + span { color: #fff; text-shadow: 0 0 5px #fff; }
        .radio-label span { color: #666; }

        button#start-btn {
            background: transparent;
            color: #fff;
            border: 1px solid #fff;
            padding: 10px 40px;
            font-family: var(--font-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.1em;
        }
        button#start-btn:hover { background: #fff; color: #000; }

        /* --- 2Dモード用スタイル --- */
        #stage-2d {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none; /* 初期状態は非表示 */
        }
        .word-particle-2d {
            position: absolute;
            opacity: 0;
            white-space: nowrap;
            color: var(--text-color);
            font-size: clamp(1rem, 2vw, 2.5rem);
            animation: floatUp 2.5s ease-out forwards;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            transition: opacity 3s ease, filter 3s ease;
        }
        .word-particle-2d.faded {
            opacity: 0.2 !important;
            filter: blur(2px) !important;
            z-index: 0 !important;
        }
        @keyframes floatUp {
            0% { opacity: 0; transform: translateY(20px) scale(0.95); filter: blur(4px); }
            100% { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        /* --- 3Dモード用キャンバス --- */
        canvas { display: block; position: absolute; top: 0; left: 0; z-index: 0; }
    </style>
    
    <script type="importmap">
        { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
</head>
<body>

    <div id="config-screen">
        <div class="input-group">
            <h1>POETICLE</h1>
            <textarea id="user-text" placeholder="ここに物語を入力してください...&#13;&#10;改行ごとに、言葉が紡がれます。"></textarea>
            
            <div class="controls">
                <label class="radio-label">
                    <input type="radio" name="mode" value="3d" checked>
                    <span>3D (Deep Dive)</span>
                </label>
                <label class="radio-label">
                    <input type="radio" name="mode" value="2d">
                    <span>2D (Classic)</span>
                </label>
            </div>

            <button id="start-btn">START</button>
        </div>
    </div>

    <div id="stage-2d"></div>
    <script type="module">
        import * as THREE from 'three';

        // --- 共通ロジック ---
        const configScreen = document.getElementById('config-screen');
        const textArea = document.getElementById('user-text');
        const startBtn = document.getElementById('start-btn');
        let isPlaying = false;

        // デフォルトのテキスト（入力がない場合用）
        const defaultText = `
        夜の底が白くなった。
        信号所に汽車が止まった。
        鳥が鳴いている。
        言葉は意味を失い、音として空間に溶けていく。
        それは、終わりの始まりのような、静かな予感だった。
        物語は、ここから動き出す。
        `;

        // テキスト分割関数
        function parseText(rawText) {
            const text = rawText.trim() === '' ? defaultText : rawText;
            return text.split(/([。、\n]+)/).reduce((acc, curr, i, arr) => {
                if (i % 2 === 0 && curr.trim().length > 0) {
                    acc.push(curr + (arr[i + 1] || '')); 
                }
                return acc;
            }, []);
        }

        // スタートボタン処理
        startBtn.addEventListener('click', () => {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            const segments = parseText(textArea.value);
            
            // UIを隠す
            configScreen.style.opacity = 0;
            setTimeout(() => configScreen.style.display = 'none', 800);
            
            if (mode === '2d') {
                start2DMode(segments);
            } else {
                start3DMode(segments);
            }
        });


        // ==========================================
        // 2D モード (Classic)
        // ==========================================
        function start2DMode(segments) {
            const stage = document.getElementById('stage-2d');
            stage.style.display = 'block';
            let currentIndex = 0;

            function nextSequence() {
                if (currentIndex >= segments.length) return;
                
                const el = document.createElement('div');
                el.classList.add('word-particle-2d');
                el.innerText = segments[currentIndex];
                
                el.style.top = `${10 + Math.random() * 80}%`;
                el.style.left = `${10 + Math.random() * 70}%`;
                el.style.fontSize = `calc(1.2rem * ${0.8 + Math.random() * 0.6})`;
                el.style.zIndex = currentIndex + 10;

                stage.appendChild(el);

                // フェードアウト処理
                setTimeout(() => el.classList.add('faded'), 5000);

                currentIndex++;
                setTimeout(nextSequence, 1800 + (Math.random() * 1000 - 500));
            }
            nextSequence();
        }


        // ==========================================
        // 3D モード (Three.js)
        // ==========================================
        function start3DMode(segments) {
            // 設定
            const CONFIG = {
                flowSpeed: 0.08, spawnZ: 5, vanishZ: -30, fogDensity: 0.06, spreadX: 12, spreadY: 8
            };

            // 初期化
            const scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, CONFIG.fogDensity);
            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 10;

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);

            const particles = [];

            // テキストテクスチャ生成
            function createTextTexture(text) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const fontSize = 64; 
                ctx.font = `${fontSize}px "Yu Mincho", "Hiragino Mincho ProN", serif`;
                const textMetrics = ctx.measureText(text);
                canvas.width = textMetrics.width + 20;
                canvas.height = fontSize * 1.5;
                ctx.font = `${fontSize}px "Yu Mincho", "Hiragino Mincho ProN", serif`;
                ctx.fillStyle = "white";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.shadowColor = "rgba(255, 255, 255, 0.8)";
                ctx.shadowBlur = 10;
                ctx.fillText(text, canvas.width/2, canvas.height/2);
                const texture = new THREE.CanvasTexture(canvas);
                texture.minFilter = THREE.LinearFilter;
                return { texture, aspect: canvas.width / canvas.height };
            }

            function create3DText(text) {
                const { texture, aspect } = createTextTexture(text);
                const material = new THREE.SpriteMaterial({ map: texture, color: 0xffffff, transparent: true, opacity: 0 });
                const sprite = new THREE.Sprite(material);
                const scaleBase = 1.5 + Math.random() * 1.0;
                sprite.scale.set(scaleBase * aspect, scaleBase, 1);
                sprite.position.set((Math.random()-0.5)*CONFIG.spreadX, (Math.random()-0.5)*CONFIG.spreadY, CONFIG.spawnZ);
                scene.add(sprite);
                particles.push({ mesh: sprite, speed: CONFIG.flowSpeed + (Math.random() * 0.02), life: 0 });
            }

            function animate() {
                requestAnimationFrame(animate);
                for (let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.mesh.position.z -= p.speed;
                    if (p.mesh.material.opacity < 1 && p.life < 100) p.mesh.material.opacity += 0.02;
                    p.life++;
                    if (p.mesh.position.z < CONFIG.vanishZ) {
                        scene.remove(p.mesh);
                        p.mesh.material.map.dispose();
                        p.mesh.material.dispose();
                        particles.splice(i, 1);
                    }
                }
                renderer.render(scene, camera);
            }
            animate();

            // 再生ループ
            let currentIndex = 0;
            function nextSequence() {
                if (currentIndex >= segments.length) return;
                create3DText(segments[currentIndex]);
                currentIndex++;
                setTimeout(nextSequence, 1800 + (Math.random() * 1000 - 500));
            }
            nextSequence();

            // リサイズ
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }
    </script>
</body>
</html>
